<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agent Board · AI 会话看板</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --border:#E4E7EC; --border2:#D0D5DD;
  --text:#101828; --text2:#475467; --text3:#98A2B3;
  --accent:#3B82F6; --accent-bg:#EFF6FF;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 8px 24px rgba(16,24,40,.10), 0 2px 6px rgba(16,24,40,.06);
  --sp:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
button{font-family:inherit;font-size:14px;border:none;cursor:pointer;background:none}
input,select{font-family:inherit;font-size:15px;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#98A2B3}
::-webkit-scrollbar-track{background:transparent}

/* 全宽布局：充分利用屏幕宽度，不再被 980px 限制 */
.app{width:100%;max-width:none;margin:0;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:14px;padding:4px 0 18px;flex-wrap:wrap}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow)}
h1{font-size:18px;font-weight:650;letter-spacing:.2px}
h1 small{display:block;font-size:11px;font-weight:400;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.stats{margin-left:auto;display:flex;gap:8px}
.runtime-health{flex:0 1 240px;min-width:150px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text3);padding:4px 8px;border:1px solid transparent;border-radius:7px}
.runtime-health.ok{color:#15803D;background:#F0FDF4;border-color:#BBF7D0}
.runtime-health.warning{color:#92400E;background:#FFFBEB;border-color:#FDE68A}
.runtime-health.error{color:#B91C1C;background:#FEF2F2;border-color:#FECACA}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 14px;text-align:center;min-width:72px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:17px;font-weight:650}
.stat span{font-size:11px;color:var(--text2)}
.icon-btn{width:40px;height:40px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.15s;box-shadow:var(--shadow)}
.icon-btn:hover{border-color:var(--border2);color:var(--text);box-shadow:var(--shadow-lg)}
.header-read-all{width:auto;padding:0 12px;font-size:13px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text);font-weight:500;min-height:44px;transition:.15s}
.btn:hover{border-color:var(--border2);background:#FBFAF8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:20;backdrop-filter:blur(8px);border-bottom:1px solid transparent}
.filters:has(input:focus),.filters:hover{border-bottom-color:var(--border)}
/* agent 统计 chips：与瀑布流列信息重复，隐藏 */
#agent-chips{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;min-height:36px;transition:.15s;box-shadow:var(--shadow)}
.chip:hover{border-color:var(--border2);transform:translateY(-1px)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
/* 搜索框：固定宽度，不挤占过滤器空间 */
.f-q{width:200px;flex-shrink:0;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--card);outline:none;min-height:44px;box-shadow:var(--shadow);transition:.15s;font-size:13px}
.f-q:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15);width:240px}
@media (max-width:1200px){.f-q{width:160px}.f-q:focus{width:180px}}
select{border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:var(--card);outline:none;min-height:44px;max-width:220px;box-shadow:var(--shadow);transition:.15s}
select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.15)}

.section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text2);margin:6px 0 10px}
.section-title .pulse{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
.section-title small{margin-left:auto;font-weight:400;color:var(--text3)}

.active-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.a-card{flex:0 0 230px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px;transition:.15s}
.a-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.a-card .top{display:flex;align-items:center;gap:8px}
.a-card .a-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.a-card .a-name{font-weight:600;font-size:13px}
.a-card .ago{margin-left:auto;font-size:11px;color:var(--text3)}
.a-card .proj{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-card .live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#16A34A;font-weight:500}

.tl{position:relative}
.tl-item{display:flex;gap:12px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background .12s}
.tl-item:hover{background:var(--card)}
.tl-item.selected{background:var(--accent-bg)}
.tl-time{flex:0 0 52px;text-align:right;font-size:12px;color:var(--text3);padding-top:2px;font-variant-numeric:tabular-nums}
.tl-main{flex:1;min-width:0}
.tl-head{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.agent-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px;color:#fff;white-space:nowrap;flex:0 0 auto}
.role-ico{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.role-ico.u{background:#E8EDF2;color:#374151}
.role-ico.a{background:#EFF6FF;color:#3B82F6}
.proj-name{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.tl-text{font-size:13.5px;color:var(--text);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tl-item.full .tl-text{-webkit-line-clamp:unset}
.summary-tag{font-size:11px;background:#FAEEDA;color:#854F0B;border-radius:6px;padding:1px 7px;margin-right:6px}

.day-group{margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.day-group span{font-size:12px;font-weight:600;color:var(--text3)}
.day-group::after{content:"";flex:1;height:1px;background:var(--border)}

/* session 卡片 */
.s-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);height:196px;min-height:196px;display:flex;flex-direction:column;padding:12px 14px 58px;margin-bottom:0;cursor:pointer;transition:.18s;position:relative;border-left:3px solid var(--border2);box-shadow:var(--shadow);overflow:hidden}
.s-card:hover{border-color:var(--border2);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.s-card.active{border-left-color:#EF4444;background:#FEF7F7;border-color:#FCA5A5;box-shadow:0 0 0 1px rgba(239,68,68,.12),0 2px 8px rgba(239,68,68,.10)}
.s-card.active .s-status.on{background:#FEE2E2;color:#B91C1C}
.s-card.active .s-status .pulse{background:#EF4444}
.s-card.done{border-left-color:#E4E7EC}
.s-card.done .s-title{color:var(--text2)}
.s-card.waiting{border-left-color:#F59E0B;background:#FFFBEB;border-color:#FCD34D}
.s-card.waiting .s-status.wait{background:#FEF3C7;color:#B45309;font-weight:600}
.s-card.failed{border-left-color:#DC2626;background:#FFF7F7;border-color:#FCA5A5}
.s-card.failed .s-status.error{background:#FEE2E2;color:#B91C1C;font-weight:600}
.s-card.interrupted{border-left-color:#9CA3AF;background:#F9FAFB}
.s-card.interrupted .s-status.interrupted{background:#E5E7EB;color:#4B5563}
.s-card.attention{border-left-color:#D97706;background:#FFFBEB}
.s-card.attention .s-status.attention{background:#FEF3C7;color:#92400E}

/* 渐变边框流光：进行中=红色；刚完成（新监控到进行中后结束）=绿色 + 「已读」按钮。
   只保留 2px 边缘渐变环流动（mask 挖空中间），无外层光晕 */
.s-card.flow-red{--flow-grad:linear-gradient(90deg,#FF2D2D,#FF6B6B,#DC2626,#FF2D2D);border-color:transparent}
.s-card.flow-green{--flow-grad:linear-gradient(90deg,#16A34A,#4ADE80,#22C55E,#16A34A);border-color:transparent;background:#FCFEFC}
.s-card.flow-red:hover,.s-card.flow-green:hover{border-color:transparent}
.s-card.flow-red::before,.s-card.flow-green::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:2;pointer-events:none;
  padding:3px;
  background:var(--flow-grad);
  background-size:400% 100%;
  animation:flow-grad 2.8s linear infinite;
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
          mask-composite:exclude;
}
.s-card.flow-green::before{animation-duration:4.5s;opacity:.9}
.s-card.flow-red>:not(.s-actions),.s-card.flow-green>:not(.s-actions){position:relative;z-index:1}
.s-card.flow-red>.s-subagent-toggle,.s-card.flow-green>.s-subagent-toggle{position:absolute;z-index:4}
@keyframes flow-grad{0%{background-position:0% 0}100%{background-position:400% 0}}
.s-flow-dismiss{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#15803D;background:#DCFCE7;border:1px solid #86EFAC;border-radius:999px;padding:2px 9px;cursor:pointer;transition:.12s;line-height:1.6}
.s-flow-dismiss:hover{background:#BBF7D0;border-color:#4ADE80;box-shadow:var(--shadow)}
.s-row1{display:flex;align-items:center;gap:8px;margin-bottom:6px;min-height:20px;flex-wrap:wrap}
.session-card-group{display:flex;flex-direction:column;min-width:0;isolation:isolate}
.session-card-children{display:flex;flex-direction:column;min-width:0;gap:0;overflow:visible}
.session-card-group.is-stacked>.session-card-children>.stack-child-card{
  --stack-peek-height:48px;
  --stack-offset:min(calc(var(--stack-index) * 4px),16px);
  margin-top:calc(var(--stack-peek-height) - 196px);
  margin-left:var(--stack-offset);
  width:calc(100% - var(--stack-offset));
  z-index:calc(100 - var(--stack-index));
}
.session-card-group.is-stacked>.stack-main-card{z-index:101}
.session-card-group.is-stacked>.session-card-children>.stack-child-card:hover{transform:none}
.session-card-group.is-expanded>.session-card-children{margin-top:10px;gap:10px}
.session-card-group.is-expanded>.session-card-children>.stack-child-card{margin-top:0}
.s-subagent-toggle{position:absolute;top:12px;right:12px;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;border-radius:7px;border:1px solid var(--border2);background:var(--card);color:var(--text2);cursor:pointer;transition:.15s}
.s-subagent-toggle:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.s-subagent-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.s-subagent-toggle svg{transition:transform .18s ease}
.session-card-group.is-expanded .s-subagent-toggle svg{transform:rotate(180deg)}
.has-subagent-toggle .s-row1{padding-right:32px}
.s-title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;min-width:0}
.s-title-leading{display:flex;align-items:flex-start;gap:7px;min-width:0;flex:1 1 auto}
.s-title-leading .agent-tag{margin-top:1px;white-space:nowrap}
.s-title-row>.s-status{flex:0 0 auto}
.s-time{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums;flex:0 0 auto;white-space:nowrap}
.s-title{font-size:13px;font-weight:600;color:var(--text);flex:1 1 auto;min-width:0;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.5;overflow-wrap:anywhere}
.s-sid{font-size:10px;color:var(--text3);font-family:ui-monospace,Consolas,monospace;border:1px dashed var(--border);border-radius:5px;padding:0 5px;background:transparent;line-height:1.6;cursor:copy;transition:.12s;flex-shrink:0}
.s-sid:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-bg)}
.s-status{font-size:11px;padding:2px 8px;border-radius:6px;background:#F1EFE8;color:var(--text2);font-weight:500;display:inline-flex;align-items:center;gap:4px}
.s-status.on{background:#DCFCE7;color:#15803D;font-weight:600}
.s-status .pulse{width:6px;height:6px;border-radius:50%;background:#16A34A;animation:blink 1.6s infinite}
.s-topology-badge{font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:650;display:inline-flex;align-items:center;white-space:nowrap}
.s-topology-badge.main{background:#ECFDF3;color:#047857;border:1px solid #A7F3D0}
.s-topology-badge.child{background:#F5F3FF;color:#6D28D9;border:1px solid #DDD6FE}
.s-topology-badge.unknown{background:#FFFBEB;color:#A16207;border:1px solid #FDE68A}
.s-topology-relation{font-size:10.5px;color:var(--text3);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.s-card.topology-child{border-left-color:#8B5CF6;margin-left:8px}
.s-card.topology-unknown{border-left-color:#D97706}
.s-proj{font-size:11.5px;color:var(--text2);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-cmd{font-size:12.5px;color:var(--text);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px;opacity:.9}
.s-row2{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;padding-right:104px;margin-top:auto;white-space:nowrap;overflow:hidden}
.s-msg{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.s-actions{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:6px;height:34px;z-index:3}
.s-more{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text2);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.12s}
.s-more:hover{border-color:var(--border2);color:var(--text);box-shadow:var(--shadow)}
.s-jump{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--text);transition:.12s;overflow:hidden}
.s-jump:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.s-jump img,.s-jump span{transition:transform .15s}

/* 跳转弹菜单 */
.popover{position:fixed;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;min-width:200px;animation:pop .12s ease}
.popover:has(.subagent-style-settings){min-width:min(300px,calc(100vw - 24px))!important;max-width:calc(100vw - 24px)}
.subagent-style-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0;padding:8px 14px 10px;border:0;border-bottom:1px solid var(--border);min-width:0}
.subagent-style-settings legend{grid-column:1/-1;padding:0;font-size:12px;color:var(--text2)}
.subagent-style-option{display:flex;align-items:flex-start;gap:7px;min-width:0;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;line-height:1.4;transition:.12s}
.subagent-style-option:hover{border-color:var(--border2);background:#FBFAF8}
.subagent-style-option:has(input:checked){border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px rgba(59,130,246,.12)}
.subagent-style-option:focus-within{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.subagent-style-option input{flex:0 0 auto;margin-top:2px;accent-color:var(--accent)}
.subagent-style-copy{min-width:0;overflow-wrap:anywhere}
.subagent-style-copy small{display:block;margin-top:2px;color:var(--text3);font-size:11px;line-height:1.35;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop-head{font-size:12px;font-weight:600;color:var(--text2);padding:4px 8px 6px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.pop-head .dot{width:8px;height:8px;border-radius:50%}
.sound-settings-head{justify-content:space-between;gap:12px}
.sound-toggle-all{min-height:30px;padding:4px 10px;font-size:12px;white-space:nowrap}
.sound-agent-list{scrollbar-width:thin}
.sound-agent-row{display:flex;align-items:center;gap:5px;margin:1px 0;border-radius:7px}
.sound-agent-row.on{background:var(--accent-bg)}
.sound-agent{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:9px 6px 9px 10px;border-radius:7px;text-align:left;color:var(--text);line-height:1.35}
.sound-agent:hover{color:var(--accent)}
.sound-agent-row.on .sound-agent{color:var(--accent)}
.sound-agent .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.sound-agent-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sound-toggle{width:36px;height:24px;flex:0 0 auto;padding:0;border-radius:999px;outline:none}
.sound-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sound-toggle-track{display:block;position:relative;width:32px;height:18px;margin:3px auto;border-radius:999px;background:#D0D5DD;transition:.15s}
.sound-toggle-thumb{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.18);transition:.15s}
.sound-toggle.on .sound-toggle-track{background:var(--accent)}
.sound-toggle.on .sound-toggle-thumb{transform:translateX(14px)}
.sound-toggle:disabled{opacity:.55;cursor:wait}
.sound-settings-panel{min-width:0}
.shortcut-settings{padding:14px 16px 16px}
.shortcut-title{font-size:14px;font-weight:650;color:var(--text)}
.shortcut-help{margin-top:4px;color:var(--text3);font-size:12px;line-height:1.55}
.shortcut-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.shortcut-input{flex:1;min-width:0;min-height:40px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#F8FAFC;color:var(--text);font-family:ui-monospace,Consolas,monospace;font-size:14px;font-weight:600;text-align:center;outline:none}
.shortcut-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.shortcut-status{min-height:20px;margin-top:8px;color:var(--text3);font-size:12px}
.shortcut-status.error{color:#B91C1C}
.shortcut-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.shortcut-actions .btn,.shortcut-row .btn{min-height:32px;padding:5px 10px;font-size:12px;white-space:nowrap}
.ab-agent-manager{width:min(720px,calc(100vw - 24px));min-width:0;max-width:none;max-height:calc(100vh - 84px);padding:0;overflow:hidden;display:flex;flex-direction:column}
.ab-manager-head{flex:0 0 auto;padding:12px 14px 10px;margin:0;align-items:center}
.ab-manager-heading{min-width:0;display:flex;flex-direction:column;gap:1px}
.ab-manager-title{font-size:14px;font-weight:650;color:var(--text)}
.ab-manager-subtitle{font-size:11px;font-weight:400;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-manager-head .ab-rescan-probe{flex:0 0 auto;min-height:30px!important;padding:4px 9px!important;font-size:11px!important}
.ab-install-guide{margin:10px 12px 0;padding:12px 14px;background:var(--accent-bg);border:1px solid #CFE0FF;border-radius:10px;flex:0 0 auto}
.ab-guide-heading{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650;color:var(--text)}
.ab-guide-kicker{display:inline-flex;align-items:center;padding:2px 6px;border-radius:5px;background:var(--accent);color:#fff;font-size:10px;font-weight:650;letter-spacing:.2px}
.ab-guide-copy{margin-top:4px;color:var(--text2);font-size:12px;line-height:1.55}
.ab-guide-steps{display:flex;gap:8px;margin-top:9px;color:var(--text2);font-size:11px;line-height:1.45}
.ab-guide-step{flex:1;min-width:0;padding:7px 8px;background:rgba(255,255,255,.72);border:1px solid rgba(59,130,246,.16);border-radius:7px}
.ab-guide-step b{display:block;color:var(--accent);font-size:10px;margin-bottom:2px}
.ab-guide-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ab-guide-actions .btn{min-height:30px;padding:5px 10px;font-size:11px}
.ab-guide-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ab-guide-prompt{margin-top:8px;padding:7px 9px;background:rgba(255,255,255,.82);border:1px dashed #B7CDF4;border-radius:7px;color:var(--text2);font-family:ui-monospace,Consolas,monospace;font-size:10px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-ai-install-panel{margin:9px 0 0;padding:9px 10px;background:rgba(255,255,255,.72);border:1px solid rgba(59,130,246,.18);border-radius:8px}
.ab-ai-install-title{font-size:11px;font-weight:650;color:var(--text)}
.ab-ai-install-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:8px}
.ab-ai-field{display:flex;flex-direction:column;gap:3px;min-width:0;color:var(--text2);font-size:10px;font-weight:600}
.ab-ai-field input,.ab-ai-field select{width:100%;min-height:32px;box-sizing:border-box;padding:5px 7px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:11px;outline:none}
.ab-ai-field input:focus,.ab-ai-field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.ab-ai-key-field{grid-column:1/-1}
.ab-ai-install-foot{display:flex;align-items:flex-end;gap:8px;margin-top:8px}
.ab-ai-help{min-width:0;flex:1;color:var(--text3);font-size:10px;line-height:1.45}
.ab-ai-install-submit{flex:0 0 auto;min-height:32px!important;padding:5px 10px!important;font-size:11px!important}
.ab-ai-install-status{min-height:14px;margin-top:4px;color:var(--text3);font-size:10px;line-height:1.4}
.ab-agent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;overflow-y:auto;min-height:0;flex:1;overscroll-behavior:contain;align-items:start}
.ab-card{min-width:0;height:auto;min-height:124px;align-self:start;display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:auto auto;align-items:start;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow);text-align:left;transition:.15s;overflow:hidden}
.ab-card:hover{border-color:var(--border2);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.ab-card-icon{grid-column:1;grid-row:1;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:650}
.ab-card-icon img{width:26px;height:26px;display:block;object-fit:contain}
.ab-card-main{grid-column:2;grid-row:1;min-width:0;min-height:0;overflow:hidden}
.ab-card-title-row{display:flex;align-items:center;gap:6px;min-width:0}
.ab-card-title{min-width:0;font-size:12px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-status-badge{flex:0 0 auto;font-size:10px;padding:2px 6px;border-radius:5px;line-height:1.35;white-space:nowrap}
.ab-status-badge.installed{background:#DCFCE7;color:#15803D}
.ab-status-badge.missing{background:#F2F4F7;color:var(--text3)}
.ab-status-badge.manual{background:#EDE9FE;color:#6D28D9}
.ab-card-path{margin-top:4px;min-width:0;font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-card-path.empty{color:#B0B7C3}
.ab-progress{min-height:14px;margin-top:3px;font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-card-actions{grid-column:1/-1;grid-row:2;display:flex;align-items:stretch;flex-wrap:wrap;gap:6px;min-width:0;min-height:0;overflow:visible;padding-top:8px;border-top:1px solid var(--border)}
.ab-card-actions .btn{flex:1 1 118px;min-width:0;justify-content:center;min-height:30px;padding:5px 8px;font-size:11px;white-space:nowrap}
.ab-manual-path{color:var(--accent)}
.ab-manual-editor{margin-top:8px;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:11px}
.ab-manual-variants{display:flex;gap:12px;color:var(--text2);margin-bottom:6px}
.ab-manual-variants label,.ab-manual-sync{display:flex;align-items:center;gap:4px;white-space:nowrap}
.ab-manual-input{width:100%;box-sizing:border-box;border:1px solid var(--border2);border-radius:6px;padding:6px 7px;background:#fff;color:var(--text);font-size:11px;outline:none}
.ab-manual-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.ab-manual-sync{margin-top:6px;color:var(--text2)}
.ab-manual-help{margin-top:5px;color:var(--text3);line-height:1.45}
.ab-manual-actions{display:flex;gap:6px;margin-top:7px}
.ab-manual-actions .btn{flex:1}
@media (max-width:620px){
  .ab-agent-grid{grid-template-columns:1fr}
}
@media (max-width:470px){
  .ab-agent-manager{right:12px!important;width:calc(100vw - 24px)!important}
  .ab-install-guide{margin-left:10px;margin-right:10px;padding:10px}
  .ab-guide-steps{display:block}
  .ab-guide-step+.ab-guide-step{margin-top:5px}
  .ab-agent-grid{padding:10px}
  .ab-ai-install-grid{grid-template-columns:1fr}
  .ab-ai-key-field{grid-column:auto}
  .ab-ai-install-foot{display:block}
  .ab-ai-install-submit{margin-top:7px;width:100%}
  .ab-card{height:auto;min-height:124px;display:grid;grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto;gap:8px;padding:10px;overflow:visible}
  .ab-card-main{grid-column:2;grid-row:1}
  .ab-card-icon{grid-column:1;grid-row:1;width:32px;height:32px;border-radius:8px;font-size:13px}
  .ab-card-actions{grid-column:1/-1;grid-row:2;display:flex;flex-direction:row;flex-wrap:wrap;min-width:0;padding-left:0;overflow:visible}
  .ab-card-actions .btn{flex:1 1 120px}
}
.pop-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--text);transition:.1s}
.pop-item:hover:not([disabled]){background:var(--accent-bg);color:var(--accent)}
.pop-item[disabled]{opacity:.45;cursor:not-allowed}
.pop-item.focus{background:var(--accent-bg);color:var(--accent);font-weight:500}
.pop-item.focus:hover{background:#DDEBFF}
.pop-item span:first-child{width:18px;text-align:center}
.lo-list{padding:10px;max-height:68vh;overflow-y:auto;overscroll-behavior:contain}
.lo-agent-row{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:12px;margin-bottom:10px;transition:.15s}
.lo-agent-row.manual-on{border-color:var(--accent);background:#F8FBFF}
.lo-agent-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lo-agent-icon{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
.lo-agent-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.lo-agent-name{font-size:13px;font-weight:650;color:var(--text)}
.lo-status{font-size:11px;color:var(--text3);margin-top:1px}
.lo-auto-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lo-auto-item{min-width:0}
.lo-auto-btn{width:100%;justify-content:center;min-height:34px;padding:6px 8px;font-size:12px;border-radius:8px}
.lo-auto-btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.lo-target-detail{margin-top:4px;color:var(--text3);font-size:10.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lo-manual-block{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.lo-manual-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.lo-manual-enabled{width:14px;height:14px;accent-color:var(--accent);margin:0}
.lo-input{width:100%;box-sizing:border-box;margin-top:7px;padding:7px 9px;font-size:12px;border:1px solid var(--border);border-radius:7px;background:#fff;outline:none}
.lo-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.lo-help{color:var(--text3);font-size:10.5px;line-height:1.45;margin-top:4px}
.lo-manual-save{margin-top:8px;min-height:32px;padding:5px 10px;font-size:12px;border-radius:8px}
.lo-manual-save:disabled{opacity:.45;cursor:not-allowed;filter:none}
@media (max-width:560px){.lo-auto-grid{grid-template-columns:1fr}.lo-list{padding:8px}}
.load-more{display:block;width:100%;padding:12px;color:var(--text2);border:1px dashed var(--border);border-radius:10px;margin-top:8px;font-size:13px}
.load-more:hover{color:var(--text);border-color:var(--border2)}
.empty{padding:48px 0;text-align:center;color:var(--text3)}
.empty svg{margin-bottom:8px;opacity:.5}

.drawer-mask{position:fixed;inset:0;background:rgba(15,20,25,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--bg);z-index:51;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer.open{transform:none}
.drawer-head{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.drawer-head .row{display:flex;align-items:center;gap:8px}
.drawer-head h2{font-size:15px;font-weight:600;word-break:break-all}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.d-msg{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.d-msg .d-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--text2)}

/* 顶栏 AI Agent 快捷图标 */
/* 顶栏 AI Agent 快捷图标（紧贴 h1 右侧，方便随时启动无 session 的 agent） */
.quick-agents{display:flex;gap:6px;align-items:center;margin-left:6px}
.quick-agents .qa-btn{box-shadow:var(--shadow)}
.qa-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:.15s;cursor:pointer;position:relative}
.qa-btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.qa-btn img{width:28px;height:28px;object-fit:contain}
.qa-btn .qb{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600}
.qa-btn .qa-dot{position:absolute;top:2px;right:2px;width:8px;height:8px;border-radius:50%;border:1.5px solid #fff;background:transparent}
.qa-btn.running .qa-dot{background:#22C55E}
#active-range{min-height:28px;padding:3px 8px;font-size:12px;border:1px solid var(--border);border-radius:8px;background:var(--card);outline:none}
.d-msg .d-meta b{color:var(--text);font-size:12px}
.d-msg .d-text{font-size:13px;white-space:pre-wrap;word-break:break-word;color:#2A2E34;line-height:1.65}
.d-msg.user{border-left:3px solid #9AA0A6}
.d-msg.assistant{border-left:3px solid var(--accent)}
.d-msg.summary{background:#FFFBEB;border-color:#F5E2B8}
.d-msg.match{box-shadow:0 0 0 2px rgba(245,158,11,.35); border-color:#F59E0B}
.d-msg .d-msg-copy{margin-left:auto;opacity:0;transition:.15s;border:none;background:none;color:var(--text3);font-size:12px;padding:2px 6px;border-radius:4px;cursor:pointer}
.d-msg:hover .d-msg-copy{opacity:1}
.d-msg .d-msg-copy:hover{background:var(--accent-bg);color:var(--accent)}

/* 抽屉增强版：工具栏 + 锚点 + 回合流 */
.d-body-rich{padding:0 !important;display:flex;flex-direction:column;gap:0}
.d-toolbar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:2;flex-wrap:wrap}
.d-tabs{display:flex;gap:4px}
.d-tab{padding:4px 10px;border:1px solid var(--border);background:var(--card);border-radius:999px;font-size:12px;color:var(--text2);transition:.15s;display:inline-flex;align-items:center;gap:4px}
.d-tab:hover{border-color:var(--border2);color:var(--text)}
.d-tab.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.d-tab .d-cnt{font-size:10.5px;background:rgba(0,0,0,.06);padding:1px 6px;border-radius:8px;min-width:18px;text-align:center}
.d-tab.on .d-cnt{background:var(--accent);color:#fff}
.d-spacer{flex:1}
.d-search{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;width:140px;outline:none;background:var(--card);transition:.15s}
.d-search:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.d-icon-btn{padding:5px 9px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:12px;color:var(--text2);transition:.15s;cursor:pointer}
.d-icon-btn:hover{border-color:var(--border2);color:var(--text);background:#FBFAF8}

.d-main{display:grid;grid-template-columns:200px 1fr;flex:1;min-height:0;overflow:hidden}
.d-anchors{border-right:1px solid var(--border);background:#FBFAF8;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:8px 0}
.d-anchors-head{font-size:11px;font-weight:600;color:var(--text3);padding:4px 12px 6px;letter-spacing:.5px;text-transform:uppercase}
.d-anchors-list{display:flex;flex-direction:column;gap:1px;padding:0 4px}
.d-anchor{flex:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1.4;transition:.12s;border-left:2px solid transparent}
.d-anchor:hover{background:#fff}
.d-anchor.on{background:var(--accent-bg);border-left-color:var(--accent);color:var(--accent);font-weight:500}
.d-anchor-time{display:block;color:var(--text3);font-variant-numeric:tabular-nums;font-size:11px}
.d-anchor-text{display:block;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-anchor-empty{font-size:12px;color:var(--text3);padding:8px 12px}

.d-flow{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.d-empty{padding:60px 0;text-align:center;color:var(--text3);font-size:13px}
.d-round{flex:none;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.d-round-head{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#FBFAF8;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;transition:.12s}
.d-round-head:hover{background:#F5F6F8}
.d-round.collapsed .d-round-head{border-bottom-color:transparent}
.d-round.collapsed .d-round-replies,.d-round.collapsed .d-msg.user{display:none}
.d-round.collapsed .d-round-toggle{transform:rotate(-90deg)}
.d-round-toggle{transition:transform .15s;color:var(--text2);margin-left:auto}
.d-round-cnt{font-size:11px;color:var(--text3);background:rgba(0,0,0,.04);padding:1px 6px;border-radius:8px}
.d-round-head .d-role-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--accent);color:#fff}
.d-round-head .d-time{font-size:12px;color:var(--text2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-round-replies{padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--card)}

@media (max-width:900px){
  .drawer{width:100vw}
  .d-main{grid-template-columns:1fr}
  .d-anchors{display:none}
}

.import-form{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px}
.import-form textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:10px;padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;resize:vertical;outline:none;background:#fff}
.import-form textarea:focus{border-color:var(--accent)}
.import-form .row{display:flex;gap:8px;flex-wrap:wrap}
.import-form input{flex:1;min-width:120px;border:1px solid var(--border);border-radius:10px;padding:9px 10px;min-height:44px;outline:none}
.import-form input:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--text3)}
.hint code{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:0 4px}

 .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1F2328;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:99;transition:transform .25s;opacity:0}
 .toast.show{transform:translateX(-50%);opacity:1}
 .monitor-nav{display:flex;align-items:center;gap:6px;margin:0 0 14px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:max-content}
 .monitor-tab{min-height:36px;padding:6px 15px;border-radius:8px;color:var(--text2);font-size:13px;font-weight:600;transition:.15s}
 .monitor-tab:hover{background:var(--accent-bg);color:var(--accent)}
 .monitor-tab.active{background:var(--accent);color:#fff}
 .monitor-panel[hidden]{display:none!important}
 .ai-monitor{display:flex;flex-direction:column;gap:14px}
 .ai-monitor-head{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
 .ai-monitor-head h2{font-size:16px;font-weight:650}
 .ai-monitor-head p{margin-top:3px;color:var(--text2);font-size:12px}
 .ai-monitor-head .ai-readiness{margin-left:auto;color:var(--text3);font-size:12px;white-space:nowrap}
 .ai-monitor-grid{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:14px;align-items:start}
 .ai-create,.ai-workflows,.ai-capabilities{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
 .ai-create{padding:14px}
 .ai-create h3,.ai-workflows h3,.ai-capabilities h3{padding:13px 14px;font-size:13px;font-weight:650;border-bottom:1px solid var(--border)}
 .ai-create h3{padding:0 0 12px}
 .ai-create .ai-form-body{display:flex;flex-direction:column;gap:9px}
 .ai-create label{display:flex;flex-direction:column;gap:4px;color:var(--text2);font-size:12px}
 .ai-create input,.ai-create select,.ai-create textarea{width:100%;min-height:38px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;outline:none;font-size:13px}
 .ai-create textarea{min-height:84px;resize:vertical}
 .ai-create input:focus,.ai-create select:focus,.ai-create textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
 .ai-create .btn{width:100%;justify-content:center;min-height:38px}
 .ai-hint{font-size:11px;line-height:1.5;color:var(--text3)}
 .ai-workflow-list{display:flex;flex-direction:column;gap:8px;padding:12px}
 .ai-workflow-card{padding:12px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:9px;background:#fff}
 .ai-workflow-card.waiting_user{border-left-color:#F59E0B;background:#FFFBEB}
 .ai-workflow-card.failed{border-left-color:#DC2626;background:#FFF7F7}
 .ai-workflow-card.completed{border-left-color:#16A34A;background:#F6FEF8}
 .ai-workflow-top,.ai-workflow-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
 .ai-workflow-top strong{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
 .ai-badge{padding:2px 7px;border-radius:5px;background:#F2F4F7;color:var(--text2);font-size:10px;white-space:nowrap}
 .ai-badge.status{background:var(--accent-bg);color:var(--accent);font-weight:650}
 .ai-workflow-meta{margin:5px 0 8px;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .ai-workflow-error{margin:5px 0 8px;color:#B45309;font-size:11px;line-height:1.45}
 .ai-workflow-actions .btn{min-height:30px;padding:5px 9px;font-size:11px}
 .ai-empty{padding:18px 14px;color:var(--text3);font-size:12px;text-align:center}
 .ai-capability-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:12px}
 .ai-capability{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:7px 8px;border:1px solid var(--border);border-radius:7px;font-size:11px}
 .ai-capability b{font-weight:600}
 .ai-capability .ready{color:#15803D}.ai-capability .missing{color:var(--text3)}
 @media (max-width:780px){.ai-monitor-grid{grid-template-columns:1fr}.ai-monitor-head{display:block}.ai-monitor-head .ai-readiness{display:block;margin:7px 0 0}}

@media (max-width:640px){
  .stats .stat:nth-child(3){display:none}
  .tl-time{flex-basis:44px}
  .proj-name{max-width:140px}
  .search{order:5;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 按 Agent 分列的瀑布流：桌面首屏固定展示 6 列，更多 Agent 横向延伸 */
.board-layout{display:grid;grid-template-columns:166px minmax(0,1fr);gap:10px;align-items:start;margin-top:0}
.project-rail{position:sticky;top:66px;max-height:calc(100vh - 86px);overflow-y:auto;padding:8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.project-rail-head{font-size:12px;font-weight:650;color:var(--text2);padding:2px 4px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.project-path{position:relative;width:100%}
.project-path-select{display:block;position:relative;width:100%;padding:8px 9px;border:1px solid transparent;border-radius:7px;color:var(--text2);text-align:left;cursor:pointer;transition:.15s;font:inherit;font-size:12px;line-height:1.35}
.project-path:hover .project-path-select{background:#FBFAF8;color:var(--text)}
.project-path.on .project-path-select{background:var(--accent-bg);border-color:#BFDBFE;color:var(--accent);font-weight:600}
.project-path-short{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-path-full{display:none;position:absolute;top:0;left:0;width:100%;box-sizing:border-box;padding:8px 9px 8px 37px;border:1px solid var(--border2);border-radius:7px;background:var(--card);color:var(--text);white-space:normal;overflow-wrap:anywhere;text-overflow:clip;box-shadow:var(--shadow-lg);z-index:1;pointer-events:none}
.project-path:hover .project-path-full{display:block}
.project-path-copy{display:none;position:absolute;top:7px;left:7px;width:24px;height:24px;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text2);z-index:2}
.project-path-copy:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.project-path:hover .project-path-copy{display:inline-flex}
.project-empty{padding:12px 4px;color:var(--text3);font-size:12px}
.board{display:grid;grid-auto-flow:column;grid-template-rows:auto;grid-auto-columns:max(180px,calc((100% - 50px)/6));gap:10px;align-items:start;min-width:100%;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;scrollbar-width:thin}
.agent-col{min-width:0;display:flex;flex-direction:column}
.col-head{font-size:13px;font-weight:650;color:var(--text2);padding:8px 2px;margin-bottom:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;position:static;flex:0 0 auto;background:var(--bg)}
.col-head::before{content:"";width:9px;height:9px;flex:none;border-radius:50%;background:var(--colc,#888780);box-shadow:0 0 0 3px var(--accent-bg)}
.col-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-cards{display:flex;flex-direction:column;gap:10px}
@media (max-width:700px){.board-layout{grid-template-columns:1fr}.project-rail{position:static;max-height:180px}.board{grid-auto-columns:minmax(220px,1fr)}}
.col-mgr-row:hover{background:var(--accent-bg)}
.col-empty{padding:14px 8px;color:var(--text3);font-size:12px;text-align:center;border:1px dashed var(--border);border-radius:8px}
/* 隐藏「活跃会话」区块（标题行 + 卡片横排），专注瀑布流 */
#active-title, #active-row { display:none !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 9h8M8 13h8M8 17h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    <h1>Agent Board<small>AI 会话时间线</small></h1>
    <span id="runtime-health" class="runtime-health" title="后端与采集器健康状态">正在连接后端…</span>
    <div class="quick-agents" id="quick-agents" title="快速启动/跳转 AI Agent"></div>
    <div class="stats">
      <div class="stat"><b id="st-today">–</b><span>今日</span></div>
      <div class="stat"><b id="st-total">–</b><span>全部消息</span></div>
      <div class="stat"><b id="st-active">–</b><span>活跃会话</span></div>
    </div>
    <button class="icon-btn" id="btn-rescan" title="重新扫描全部数据源">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="btn-import" title="手动导入对话">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </button>
    <button class="icon-btn header-read-all" id="btn-dismiss-recent" title="将所有“刚完成”会话标记为已读">一键已读</button>
    <button class="icon-btn" id="btn-hidden" title="查看 / 恢复已隐藏的会话">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><path d="M3 3l18 18"/></svg>
    </button>
  </header>

  <nav class="monitor-nav" id="monitor-nav" aria-label="监控模式">
    <button class="monitor-tab active" type="button" data-monitor-mode="manual">人工监控</button>
    <button class="monitor-tab" type="button" data-monitor-mode="ai">AI 监控</button>
  </nav>

  <div class="monitor-panel" id="manual-monitor-panel">
  <div class="filters">
    <div class="chips" id="agent-chips"></div>
    <select id="f-onlyuser" title="只显示你本人发过指令的会话，隐藏 AI 自行创建的会话">
      <option value="1" selected>仅我发过指令</option>
      <option value="0">全部会话</option>
    </select>
    <select id="f-range">
      <option value="0">全部时间</option>
      <option value="1">今天</option>
      <option value="-1">最近 24 小时</option>
      <option value="3">近 3 天</option>
      <option value="7" selected>近 7 天</option>
      <option value="30">近 30 天</option>
    </select>
    <input id="f-q" class="f-q" placeholder="搜索对话内容…">
    <button class="icon-btn" id="btn-settings-hub" title="设置">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="icon-btn" id="btn-agents" title="应用管理（查看各 AI Agent 安装状态）">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
    </button>
  </div>

  <div id="import-box" class="import-form" style="display:none">
    <div class="row">
      <input id="imp-agent" placeholder="来源名称，如其他" value="other">
      <input id="imp-title" placeholder="会话标题（可选）">
      <input id="imp-project" placeholder="项目/目录（可选）">
    </div>
    <textarea id="imp-json" placeholder='粘贴 JSON 数组，每项含 role / content / timestamp，例如：
[{"role":"user","content":"帮我写个方案","timestamp":"2026-08-20T10:00:00"},{"role":"assistant","content":"好的…"}]'></textarea>
    <div class="row">
      <button class="btn primary" id="imp-submit">导入</button>
      <button class="btn" id="imp-cancel">取消</button>
      <span class="hint" style="margin-left:auto">格式：<code>[{"role":"user|assistant","content":"…","timestamp":"ISO 时间"}]</code></span>
    </div>
  </div>

  <div class="section-title" id="active-title" style="display:none">
    <span class="pulse"></span><span id="active-label">今天活跃的会话</span>
    <select id="active-range" style="min-height:28px;padding:3px 8px;font-size:12px;margin-left:6px">
      <option value="day" selected>当天</option>
      <option value="24h">近 24 小时</option>
      <option value="week">近一周</option>
      <option value="month">近一个月</option>
    </select>
    <select id="active-project" style="min-height:28px;padding:3px 8px;font-size:12px"><option value="">全部项目</option></select>
    <small id="active-note"></small>
  </div>
  <div class="active-row" id="active-row"></div>

  <div class="board-layout" id="board-layout">
    <aside class="project-rail" id="project-rail"></aside>
    <div class="board" id="board"></div>
  </div>
  </div>

  <section class="monitor-panel ai-monitor" id="ai-monitor-panel" hidden>
    <div class="ai-monitor-head">
      <div><h2>AI 监控</h2><p>Jarvis 负责判断与编排，执行 Agent 负责在受控项目目录内执行。</p></div>
      <div class="ai-readiness" id="ai-readiness">正在读取模型能力…</div>
    </div>
    <div class="ai-monitor-grid">
      <form class="ai-create" id="ai-create-form">
        <h3>创建接管任务</h3>
        <div class="ai-form-body">
          <label>项目目录<input id="ai-project-path" required placeholder="例如 C:\\Projects\\demo"></label>
          <label>任务目标<textarea id="ai-goal" required placeholder="描述要完成的目标、验收条件或维护事项"></textarea></label>
          <label>执行 Agent<select id="ai-agent"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="workbuddy">WorkBuddy</option></select></label>
          <label>接管范围<select id="ai-mode"><option value="project">单个项目 AI 接管</option><option value="global">全局 AI 接管策略</option></select></label>
          <button class="btn primary" type="submit">创建 AI 工作流</button>
          <div class="ai-hint">创建只生成草稿；执行前仍会检查项目类型、Git 状态、允许目录和当前控制权。未启用 headless 执行时不会启动 CLI。</div>
        </div>
      </form>
      <div class="ai-workflows"><h3>工作流</h3><div class="ai-workflow-list" id="ai-workflow-list"><div class="ai-empty">暂无 AI 工作流</div></div></div>
    </div>
    <div class="ai-capabilities"><h3>模型能力与 API Key 状态（只显示是否可用）</h3><div class="ai-capability-list" id="ai-capability-list"></div></div>
  </section>
</div>

<div class="drawer-mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head" id="drawer-head"></div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="/scroll-containment.js"></script>
<script src="/api-client.js"></script>
<script src="/shortcut-utils.js"></script>
<script src="/session-card-stacking.js"></script>
<script src="/app.js"></script>
</body>
</html>
