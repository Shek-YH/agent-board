# 宝塔反向代理 location 片段：粘贴到 admin.example.com 对应站点的 location /。
# TLS、证书、宝塔 Include 和 BEGIN/END 标记由宝塔面板管理，禁止用此片段覆盖整个 server 块。
# ^~ prevents Baota's generic static-file regex locations from intercepting
# Next.js assets under /_next/ before they reach the admin container.
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
}

location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
}
